[project]
name = "lossrun"
version = "0.1.0"
description = "Combine insurance loss-run PDFs from different carriers into one claims table"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openpyxl",
    "pdfplumber",
    "pydantic>=2",
    "typer",
]

[project.scripts]
lossrun = "lossrun.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "reportlab",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lossrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
